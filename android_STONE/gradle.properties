org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# O SDK da Stone 4.15.0 ainda arrasta com.android.support:support-compat:28,
# que colide com o androidx.core do app no merge de manifest. O Jetifier
# reescreve essas dependencias para AndroidX. So existe nesta variante: a
# build generica nao precisa e nao paga o custo.
android.enableJetifier=true
# Os jars nativos do motor Flutter (io.flutter:*_debug) nao tem nada de
# AndroidX para reescrever, mas sem esta exclusao o Jetifier tenta
# transforma-los mesmo assim e estoura o heap do worker.
android.jetifier.ignorelist=armeabi_v7a_debug,arm64_v8a_debug,x86_64_debug
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false